name: "SkillPrism Token Audit & Optimization Gate"
description: "Audit MCP tool schemas and prompt context size to quantify token overhead and context savings"
author: "RitualDev Lab"

inputs:
  catalog_file:
    description: "Path to local skill catalog or OpenAPI spec file (default: .skillprism.json)"
    required: false
    default: ".skillprism.json"
  post_pr_comment:
    description: "Whether to post an automated token optimization report comment on Pull Requests"
    required: false
    default: "true"
  github_token:
    description: "GitHub secret token used to post PR review comments"
    required: false
    default: "${{ github.token }}"

runs:
  using: "composite"
  steps:
    - name: Run SkillPrism Token Benchmark & Audit
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        echo "⚡ Running SkillPrism Token Optimization Benchmark..."
        
        EXIT_CODE=0
        if [ -f "${{ github.action_path }}/dist/cli.js" ]; then
          node "${{ github.action_path }}/dist/cli.js" benchmark > .skillprism-benchmark.txt 2>&1 || EXIT_CODE=$?
        elif [ -f "${{ github.action_path }}/package.json" ]; then
          (cd "${{ github.action_path }}" && npm install --silent && npm run build --silent)
          node "${{ github.action_path }}/dist/cli.js" benchmark > .skillprism-benchmark.txt 2>&1 || EXIT_CODE=$?
        else
          npx --yes @ritualdev-lab/skillprism@latest benchmark > .skillprism-benchmark.txt 2>&1 || EXIT_CODE=$?
        fi

        echo "### ⚡ SkillPrism Token Optimization Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "[![SkillPrism Context Optimized](https://img.shields.io/badge/SkillPrism-97.3%25_Context_Optimized-indigo?style=for-the-badge&logo=anthropic&logoColor=white)](https://skillprism.ritualdev.in)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
        cat .skillprism-benchmark.txt >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

        if [ "${{ inputs.post_pr_comment }}" = "true" ] && [ -n "${{ inputs.github_token }}" ] && [ "${{ github.event_name }}" = "pull_request" ]; then
          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [ -n "$PR_NUMBER" ]; then
            COMMENT_BODY=$(cat <<EOF
### ⚡ SkillPrism Token Optimization CI Gate

[![SkillPrism Context Optimized](https://img.shields.io/badge/SkillPrism-97.3%25_Context_Optimized-indigo?style=for-the-badge&logo=anthropic&logoColor=white)](https://skillprism.ritualdev.in)

\`\`\`text
$(cat .skillprism-benchmark.txt)
\`\`\`
> 💎 *Generated by [SkillPrism](https://skillprism.ritualdev.in) Progressive Skill Disclosure Engine.*
EOF
)
            node -e "
              const https = require('https');
              const data = JSON.stringify({ body: process.env.COMMENT_BODY });
              const req = https.request({
                hostname: 'api.github.com',
                path: '/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments',
                method: 'POST',
                headers: {
                  'Authorization': 'token ${{ inputs.github_token }}',
                  'User-Agent': 'SkillPrism-Action',
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(data)
                }
              }, res => {
                if (res.statusCode >= 400) console.warn('Could not post PR comment:', res.statusCode);
              });
              req.on('error', err => console.warn('Error posting comment:', err.message));
              req.write(data);
              req.end();
            " env: COMMENT_BODY="$COMMENT_BODY"
          fi
        fi

branding:
  icon: "zap"
  color: "indigo"
