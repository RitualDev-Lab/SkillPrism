name: 🐛 Bug Report
description: File a bug report to help us improve the AgentShield defense engine.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
        *(Note: If you discovered a security vulnerability or bypass, please submit a [Private Security Advisory](https://github.com/RitualDev-Lab/AgentShield/security/advisories/new) instead).*
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps or commands to reproduce the issue.
      placeholder: |
        1. Run `npx @ritualdev-lab/agentshield scan ./myfile.ts`
        2. Output shows...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AgentShield Version
      description: Run `agentshield --version`
      placeholder: "0.2.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Ubuntu / Debian Linux
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 11 / 10
        - Docker Container
    validations:
      required: true
