name: 💡 Feature Request
description: Propose a new feature, redaction detector, or sandboxing enhancement.
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or new agent workflow?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Target Framework / Environment
      description: (e.g. Claude Code, Cursor, Windsurf, LangGraph, CrewAI, Docker)
