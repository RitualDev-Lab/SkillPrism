name: Publish Package & Release
on:
  release:
    types: [published]
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish-gpr:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://npm.pkg.github.com"
          scope: "@ritualdev-lab"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Test Suite
        run: pnpm test

      - name: Build SkillPrism Bundles
        run: pnpm run build

      - name: Publish to GitHub Packages
        run: |
          node -e "const pkg = require('./package.json'); pkg.publishConfig = { registry: 'https://npm.pkg.github.com' }; require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');"
          echo "@ritualdev-lab:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> .npmrc
          npm publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}



  publish-npm:
    name: Publish to npm Registry
    runs-on: ubuntu-latest
    if: github.repository == 'RitualDev-Lab/SkillPrism'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Test Suite
        run: pnpm test

      - name: Build SkillPrism
        run: pnpm run build

      - name: Publish to npm
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            pnpm publish --no-git-checks --access public
          else
            echo "NPM_TOKEN is not configured, skipping npm registry publish."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

