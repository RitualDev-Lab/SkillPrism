{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "skillprism-hub.fullname" . }}-redis
  labels:
    app.kubernetes.io/name: {{ include "skillprism-hub.name" . }}-redis
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/name: {{ include "skillprism-hub.name" . }}-redis
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
