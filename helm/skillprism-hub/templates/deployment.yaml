apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "skillprism-hub.fullname" . }}
  labels:
    {{- include "skillprism-hub.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "skillprism-hub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "skillprism-hub.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "skillprism-hub.fullname" .) }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "8080"
            {{- if .Values.redis.enabled }}
            - name: SKILLPRISM_REDIS_URL
              value: "redis://:{{ .Values.redis.password }}@{{ include "skillprism-hub.fullname" . }}-redis:6379/0"
            {{- else }}
            - name: SKILLPRISM_REDIS_URL
              value: {{ .Values.externalRedis.url | quote }}
            {{- end }}
            - name: SKILLPRISM_SHARED_CACHE
              value: {{ .Values.config.sharedCacheEnabled | quote }}
            - name: SKILLPRISM_CACHE_TTL_DAYS
              value: {{ .Values.config.cacheTtlDays | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
